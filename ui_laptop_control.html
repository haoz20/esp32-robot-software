<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Robot Control (laptop-side)</title>
<link rel="stylesheet" href="ui_laptop_control.css">
</head>
<body>

<div class="layout">

  <!-- ================= drive (left) ================= -->
  <div class="panel col-drive">
      <h2>Drive</h2>
      <div class="pad">
        <div class="slot"></div>
        <button class="ctl" data-cmd="go" data-hold="1">
          <span class="glyph">&#9650;</span>Forward<span class="badge">W</span>
        </button>
        <div class="slot"></div>

        <button class="ctl" data-cmd="left" data-hold="1">
          <span class="glyph">&#9664;</span>Left<span class="badge">A</span>
        </button>
        <button class="ctl stop" data-cmd="stop">
          <span class="glyph">&#9632;</span>Stop<span class="badge">&#8679;</span>
        </button>
        <button class="ctl" data-cmd="right" data-hold="1">
          <span class="glyph">&#9654;</span>Right<span class="badge">D</span>
        </button>

        <div class="slot"></div>
        <button class="ctl" data-cmd="back" data-hold="1">
          <span class="glyph">&#9660;</span>Backward<span class="badge">S</span>
        </button>
        <div class="slot"></div>
      </div>

      <div class="row">
        <button class="ctl" data-cmd="ledon">
          Light ON<span class="badge">Q</span>
        </button>
        <button class="ctl" data-cmd="ledoff">
          Light OFF<span class="badge">E</span>
        </button>
        <button class="ctl shoot wide" data-cmd="shoot">
          &#127919; Shoot<span class="badge">Space</span>
        </button>
      </div>
  </div>

  <!-- ================= video (center) ================= -->
  <div class="panel col-video">
    <h2>Camera stream</h2>
    <img id="stream" alt="" style="display:none">
    <div class="placeholder" id="placeholder">
      <div class="big">Connecting to camera&hellip;</div>
      <div id="streamurl"></div>
    </div>
  </div>

  <!-- ================= status (right) ================= -->
  <div class="col-status stack">
  <div class="panel">
      <h2>Modes</h2>
      <div class="modes">
        <button class="toggle" id="toggle-auto" data-mode="auto" aria-pressed="false">
          <span class="toggle-text"><span class="toggle-name">Autonomy</span><span class="toggle-desc">robot drives itself</span></span>
          <span class="switch"></span>
        </button>
        <button class="toggle" id="toggle-detect" data-mode="detect" aria-pressed="false">
          <span class="toggle-text"><span class="toggle-name">Detection</span><span class="toggle-desc">YOLO boxes on the stream</span></span>
          <span class="switch"></span>
        </button>
      </div>
      <div class="note" id="mode-note">Checking for the bridge&hellip;</div>
  </div>
  <div class="panel">
      <h2>Status</h2>
      <div class="status">
        <div class="stat"><span class="dot" id="dot-drive"></span><span class="label">Drive</span><span class="val" id="val-drive">idle</span></div>
        <div class="stat"><span class="dot" id="dot-led"></span><span class="label">Light</span><span class="val" id="val-led">off</span></div>
        <div class="stat"><span class="dot" id="dot-shoot"></span><span class="label">Shoot</span><span class="val" id="val-shoot">ready</span></div>
        <div class="stat"><span class="dot warn" id="dot-link"></span><span class="label">Link</span><span class="val" id="val-link">unknown</span></div>
        <div class="stat"><span class="dot warn" id="dot-bridge"></span><span class="label">Bridge</span><span class="val" id="val-bridge">checking</span></div>
        <div class="stat"><span class="dot" id="dot-auto"></span><span class="label">Autonomy</span><span class="val" id="val-auto">off</span></div>
        <div class="stat"><span class="dot" id="dot-detect"></span><span class="label">Detection</span><span class="val" id="val-detect">off</span></div>
      </div>
  </div>
  </div>

  <!-- ================= keyboard map (full width, bottom) ================= -->
  <div class="panel col-keys">
    <h2>Keyboard map</h2>
    <div class="keymap">
      <div class="item"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="desc">drive &mdash; hold to move, release to stop</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>&#8679; Shift</kbd><span class="desc">immediate stop</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>Q</kbd><kbd>E</kbd><span class="desc">light on / off</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>Space</kbd><span class="desc">shoot</span></div>
    </div>
  </div>
</div>

<script>
var ROBOT_IP = '192.168.4.1';
function robotOrigin() {
  return 'http://' + ROBOT_IP;
}
// Laptop-side backend (python -m bridge): runs YOLO and autonomy.
var BRIDGE = 'http://localhost:8001';

// ---- camera stream ----
// The robot streams to one client at a time. With the bridge running, the
// bridge is that client and re-serves the video (with YOLO boxes); without
// it, the page falls back to the robot's stream directly. The page must not
// hold the robot's stream while the bridge runs, or the bridge gets no video.
var img = document.getElementById('stream');
var placeholder = document.getElementById('placeholder');
var streamSource = null; // 'bridge' | 'robot'
function streamUrl() {
  return streamSource === 'bridge' ? BRIDGE + '/stream' : robotOrigin() + ':81/stream';
}
function useStream(source) {
  if (streamSource === source) return;
  streamSource = source;
  document.getElementById('streamurl').textContent = streamUrl();
  img.src = streamUrl() + '?' + Date.now();
}
var retryTimer = null;
img.onload = function () { img.style.display = 'block'; placeholder.style.display = 'none'; };
img.onerror = function () {
  img.style.display = 'none'; placeholder.style.display = 'flex';
  clearTimeout(retryTimer);
  retryTimer = setTimeout(function () { img.src = streamUrl() + '?' + Date.now(); }, 2000);
};

// ---- command transport ----
function setLink(ok) {
  document.getElementById('dot-link').className = 'dot ' + (ok ? 'on' : 'off');
  document.getElementById('val-link').textContent = ok ? 'connected' : 'no response';
}
function send(cmd) {
  var x = new XMLHttpRequest();
  x.open('GET', robotOrigin() + '/' + cmd + '?' + Date.now(), true);
  x.timeout = 2000;
  x.onload = function () { setLink(true); };   // request landed, response readable
  x.onerror = function () { setLink(false); }; // could be offline, or just no CORS header on this route
  x.ontimeout = function () { setLink(false); };
  x.send();
}

// ---- element lookup by command ----
var ctls = {};
[].forEach.call(document.querySelectorAll('button.ctl'), function (b) {
  ctls[b.dataset.cmd] = b;
});
function setActive(cmd, on) {
  if (ctls[cmd]) ctls[cmd].classList.toggle('active', on);
}

// ---- status indicators ----
function setDrive(cmd) {
  var names = { go: 'forward', back: 'backward', left: 'left', right: 'right' };
  var moving = !!names[cmd];
  document.getElementById('val-drive').textContent = moving ? names[cmd] : 'idle';
  document.getElementById('dot-drive').className = 'dot' + (moving ? ' on' : '');
}
function setLed(on) {
  document.getElementById('val-led').textContent = on ? 'on' : 'off';
  document.getElementById('dot-led').className = 'dot' + (on ? ' on' : '');
}
var shootTimer = null;
function flashShoot() {
  var dot = document.getElementById('dot-shoot');
  var val = document.getElementById('val-shoot');
  dot.className = 'dot fire';
  val.textContent = 'firing';
  clearTimeout(shootTimer);
  shootTimer = setTimeout(function () {
    dot.className = 'dot';
    val.textContent = 'ready';
    setActive('shoot', false);
  }, 350);
}

// ---- modes (autonomy / detection), via the bridge ----
// The bridge is the source of truth: the toggles show what /status and
// /mode report, not what was clicked. Polling /status is also the bridge's
// heartbeat -- if it stops (tab closed, laptop asleep) the bridge turns
// autonomy off and stops the robot.
var modes = { auto: false, detect: false };
var bridgeUp = false;
var bridgeFails = 0;

function setText(id, text) { document.getElementById(id).textContent = text; }
function setDot(id, cls) { document.getElementById(id).className = 'dot' + (cls ? ' ' + cls : ''); }

function renderToggle(mode, on, enabled) {
  var btn = document.getElementById('toggle-' + mode);
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.disabled = !enabled;
}
function renderModes(s) {
  modes.auto = s.auto;
  modes.detect = s.detect;
  renderToggle('auto', s.auto, s.detector_available);
  renderToggle('detect', s.detect, s.detector_available);

  setText('val-auto', s.auto ? (s.nav_state || 'starting').toLowerCase() : 'off');
  setDot('dot-auto', s.auto ? 'on' : '');
  var top = s.detections[0];
  setText('val-detect', !s.detect ? 'off'
    : top ? top.label + ' ' + top.confidence.toFixed(2) : 'nothing');
  setDot('dot-detect', s.detect ? (top ? 'fire' : 'on') : '');
  setText('val-bridge', s.stream.ok ? 'running' : 'waiting for robot');
  setDot('dot-bridge', s.stream.ok ? 'on' : 'warn');

  var note = document.getElementById('mode-note');
  note.style.display = s.detector_available ? 'none' : 'block';
  note.textContent = 'The bridge could not load the YOLO model; autonomy and detection are unavailable.';
}
function renderBridgeDown() {
  modes.auto = false;
  modes.detect = false;
  renderToggle('auto', false, false);
  renderToggle('detect', false, false);
  setText('val-auto', 'off'); setDot('dot-auto', '');
  setText('val-detect', 'off'); setDot('dot-detect', '');
  setText('val-bridge', 'not running'); setDot('dot-bridge', 'off');
  var note = document.getElementById('mode-note');
  note.style.display = 'block';
  note.innerHTML = 'Start the bridge to use these: <kbd>python -m bridge</kbd>';
}

function pollStatus() {
  var x = new XMLHttpRequest();
  x.open('GET', BRIDGE + '/status', true);
  x.timeout = 1000;
  x.onload = function () {
    if (x.status !== 200) { onBridgeDown(); return; }
    bridgeFails = 0;
    bridgeUp = true;
    useStream('bridge');
    renderModes(JSON.parse(x.responseText));
  };
  x.onerror = x.ontimeout = onBridgeDown;
  x.onloadend = function () { setTimeout(pollStatus, 500); };
  x.send();
}
function onBridgeDown() {
  bridgeFails++;
  // Wait for a few misses before falling back, so one slow reply doesn't
  // make the page grab the robot's stream away from a running bridge.
  if (bridgeFails >= 3 || streamSource === null) {
    bridgeUp = false;
    useStream('robot');
    renderBridgeDown();
  }
}
function postMode(body, done) {
  var x = new XMLHttpRequest();
  x.open('POST', BRIDGE + '/mode', true);
  x.timeout = 6000; // turning autonomy off waits for its current tick
  x.setRequestHeader('Content-Type', 'application/json');
  x.onload = function () { if (x.status === 200) renderModes(JSON.parse(x.responseText)); };
  x.onloadend = function () { if (done) done(); };
  x.send(JSON.stringify(body));
}
[].forEach.call(document.querySelectorAll('button.toggle'), function (b) {
  b.addEventListener('click', function () {
    if (!bridgeUp) return;
    var body = {};
    body[b.dataset.mode] = !modes[b.dataset.mode];
    postMode(body);
  });
});
// Manual control wins: any drive input while autonomy runs turns it off
// (which stops the robot) before the manual command is sent, so the two
// never fight over the motors.
function takeOverFromAuto(then) {
  if (!modes.auto) { then(); return; }
  modes.auto = false;
  postMode({ auto: false }, then);
}
pollStatus();

// ---- command dispatch ----
var current = null; // currently held movement command

function startMove(cmd) {
  if (current === cmd) return;
  if (current) setActive(current, false);
  current = cmd;
  setActive(cmd, true);
  setDrive(cmd);
  // Still held once autonomy has let go? Then drive.
  takeOverFromAuto(function () { if (current === cmd) send(cmd); });
}
function stopMove() {
  if (current) setActive(current, false);
  current = null;
  send('stop');
  setDrive(null);
}
function doCommand(cmd) {
  if (cmd === 'stop') {
    stopMove();
    if (modes.auto) takeOverFromAuto(function () {});
    setActive('stop', true);
    setTimeout(function () { setActive('stop', false); }, 150);
  } else if (cmd === 'ledon') {
    send('ledon'); setLed(true);
    setActive('ledon', true); setActive('ledoff', false);
  } else if (cmd === 'ledoff') {
    send('ledoff'); setLed(false);
    setActive('ledoff', true); setActive('ledon', false);
    setTimeout(function () { setActive('ledoff', false); }, 150);
  } else if (cmd === 'shoot') {
    send('shoot');
    setActive('shoot', true);
    flashShoot();
  }
}

// ---- mouse / touch ----
[].forEach.call(document.querySelectorAll('button.ctl'), function (b) {
  var cmd = b.dataset.cmd;
  if (b.dataset.hold) {
    var down = function (e) { e.preventDefault(); startMove(cmd); };
    var up = function (e) { e.preventDefault(); if (current === cmd) stopMove(); };
    b.addEventListener('mousedown', down);
    b.addEventListener('touchstart', down, { passive: false });
    b.addEventListener('mouseup', up);
    b.addEventListener('mouseleave', up);
    b.addEventListener('touchend', up);
  } else {
    b.addEventListener('click', function () { doCommand(cmd); });
  }
});

// ---- keyboard (uses e.code: physical key, layout independent) ----
var holdKeys = { KeyW: 'go', KeyS: 'back', KeyA: 'left', KeyD: 'right' };
var tapKeys = { ShiftLeft: 'stop', KeyQ: 'ledon', KeyE: 'ledoff', Space: 'shoot' };

window.addEventListener('keydown', function (e) {
  var hold = holdKeys[e.code];
  var tap = tapKeys[e.code];
  if (!hold && !tap) return;
  e.preventDefault();          // stops Space from scrolling the page
  if (e.repeat) return;        // one request per physical press
  if (hold) startMove(hold);
  else { doCommand(tap); setActive(tap, true); }
});

window.addEventListener('keyup', function (e) {
  var hold = holdKeys[e.code];
  if (hold) {
    e.preventDefault();
    if (current === hold) stopMove();
    return;
  }
  if (tapKeys[e.code] && e.code !== 'ShiftLeft') {
    setActive(tapKeys[e.code], false);
  }
});

// safety: never leave the robot driving if the window loses focus
window.addEventListener('blur', function () { if (current) stopMove(); });
</script>
</body>
</html>

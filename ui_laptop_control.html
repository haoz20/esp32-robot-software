<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Robot Control (laptop-side)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #f4f5f7;
    color: #1c1f23;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .layout {
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr) 300px;
    grid-template-areas:
      "drive video status"
      "keys  keys  keys";
    gap: 20px;
    align-items: start;
  }
  .col-drive  { grid-area: drive; }
  .col-video  { grid-area: video; }
  .col-status { grid-area: status; }
  .col-keys   { grid-area: keys; }

  @media (max-width: 1100px) {
    .layout {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "video  video"
        "drive  status"
        "keys   keys";
    }
  }

  .panel {
    background: #fff;
    border: 1px solid #e3e5e9;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .panel h2 {
    font-size: 12px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    margin: 0 0 12px;
  }

  /* ---- video ---- */
  #stream {
    width: 100%;
    display: block;
    border-radius: 8px;
    background: #10131a;
    aspect-ratio: 4 / 3;
    object-fit: contain;
  }
  .placeholder {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 8px;
    background: #10131a;
    color: #6b7280;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
  }
  .placeholder .big { font-size: 15px; color: #9aa1ab; }

  /* ---- d-pad ---- */
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 92px);
    grid-template-rows: repeat(3, 92px);
    gap: 10px;
    justify-content: center;
  }
  .pad .slot { visibility: hidden; }

  button.ctl {
    position: relative;
    border: 1px solid #d7dae0;
    border-radius: 10px;
    background: #fbfbfc;
    color: #1c1f23;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.08s, border-color 0.08s, transform 0.06s;
  }
  button.ctl .glyph { font-size: 20px; line-height: 1; }
  button.ctl:hover { background: #f1f3f6; }
  button.ctl.active {
    background: #dbeafe;
    border-color: #3b82f6;
    transform: scale(0.97);
  }
  button.ctl.stop.active { background: #fee2e2; border-color: #ef4444; }

  .badge {
    position: absolute;
    top: 5px;
    right: 5px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 4px;
    background: #eceef2;
    border: 1px solid #d7dae0;
    color: #6b7280;
    font-size: 10px;
    font-weight: 600;
    line-height: 15px;
    text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button.ctl.active .badge {
    background: #fff;
    border-color: #3b82f6;
    color: #1d4ed8;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .row button.ctl { height: 56px; flex-direction: row; gap: 8px; }
  .wide { grid-column: 1 / -1; }
  button.ctl.shoot { background: #fff7ed; border-color: #fdba74; color: #9a3412; }
  button.ctl.shoot.active { background: #fed7aa; border-color: #ea580c; }

  /* ---- status indicators ---- */
  .status { display: flex; flex-direction: column; gap: 9px; }
  .stat {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: #374151;
  }
  .stat .label { flex: 1; color: #6b7280; }
  .stat .val { font-weight: 600; font-variant-numeric: tabular-nums; }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #cbd2da;
    flex: none;
    transition: background 0.1s;
  }
  .dot.on { background: #22c55e; }
  .dot.warn { background: #f59e0b; }
  .dot.fire { background: #ea580c; }
  .dot.off { background: #ef4444; }

  kbd {
    display: inline-block;
    min-width: 20px;
    padding: 1px 5px;
    border-radius: 4px;
    background: #eceef2;
    border: 1px solid #d7dae0;
    border-bottom-width: 2px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: #374151;
    text-align: center;
  }
  .keymap {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 28px;
    font-size: 13px;
  }
  .keymap .item { display: flex; align-items: center; gap: 8px; }
  .keymap .desc { color: #6b7280; }
  .keymap .sep { width: 1px; align-self: stretch; background: #e3e5e9; }

  .note {
    margin-top: 10px;
    font-size: 12px;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    padding: 8px 10px;
  }
</style>
</head>
<body>

<div class="layout">

  <!-- ================= drive (left) ================= -->
  <div class="panel col-drive">
      <h2>Drive</h2>
      <div class="pad">
        <div class="slot"></div>
        <button class="ctl" data-cmd="go" data-hold="1">
          <span class="glyph">&#9650;</span>Forward<span class="badge">W</span>
        </button>
        <div class="slot"></div>

        <button class="ctl" data-cmd="left" data-hold="1">
          <span class="glyph">&#9664;</span>Left<span class="badge">A</span>
        </button>
        <button class="ctl stop" data-cmd="stop">
          <span class="glyph">&#9632;</span>Stop<span class="badge">&#8679;</span>
        </button>
        <button class="ctl" data-cmd="right" data-hold="1">
          <span class="glyph">&#9654;</span>Right<span class="badge">D</span>
        </button>

        <div class="slot"></div>
        <button class="ctl" data-cmd="back" data-hold="1">
          <span class="glyph">&#9660;</span>Backward<span class="badge">S</span>
        </button>
        <div class="slot"></div>
      </div>

      <div class="row">
        <button class="ctl" data-cmd="ledon">
          Light ON<span class="badge">Q</span>
        </button>
        <button class="ctl" data-cmd="ledoff">
          Light OFF<span class="badge">E</span>
        </button>
        <button class="ctl shoot wide" data-cmd="shoot">
          &#127919; Shoot<span class="badge">Space</span>
        </button>
      </div>
  </div>

  <!-- ================= video (center) ================= -->
  <div class="panel col-video">
    <h2>Camera stream</h2>
    <img id="stream" alt="" style="display:none">
    <div class="placeholder" id="placeholder">
      <div class="big">Connecting to camera&hellip;</div>
      <div id="streamurl"></div>
    </div>
  </div>

  <!-- ================= status (right) ================= -->
  <div class="panel col-status">
      <h2>Status</h2>
      <div class="status">
        <div class="stat"><span class="dot" id="dot-drive"></span><span class="label">Drive</span><span class="val" id="val-drive">idle</span></div>
        <div class="stat"><span class="dot" id="dot-led"></span><span class="label">Light</span><span class="val" id="val-led">off</span></div>
        <div class="stat"><span class="dot" id="dot-shoot"></span><span class="label">Shoot</span><span class="val" id="val-shoot">ready</span></div>
        <div class="stat"><span class="dot warn" id="dot-link"></span><span class="label">Link</span><span class="val" id="val-link">unknown</span></div>
      </div>
  </div>

  <!-- ================= keyboard map (full width, bottom) ================= -->
  <div class="panel col-keys">
    <h2>Keyboard map</h2>
    <div class="keymap">
      <div class="item"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span class="desc">drive &mdash; hold to move, release to stop</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>&#8679; Shift</kbd><span class="desc">immediate stop</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>Q</kbd><kbd>E</kbd><span class="desc">light on / off</span></div>
      <div class="sep"></div>
      <div class="item"><kbd>Space</kbd><span class="desc">shoot</span></div>
    </div>
  </div>
</div>

<script>
var ROBOT_IP = '192.168.4.1';
function robotOrigin() {
  return 'http://' + ROBOT_IP;
}

// ---- camera stream ----
var img = document.getElementById('stream');
var placeholder = document.getElementById('placeholder');
function loadStream() {
  var url = robotOrigin() + ':81/stream';
  document.getElementById('streamurl').textContent = url;
  img.src = url;
}
img.onload = function () { img.style.display = 'block'; placeholder.style.display = 'none'; };
img.onerror = function () { img.style.display = 'none'; placeholder.style.display = 'flex'; };
loadStream();

// ---- command transport ----
function setLink(ok) {
  document.getElementById('dot-link').className = 'dot ' + (ok ? 'on' : 'off');
  document.getElementById('val-link').textContent = ok ? 'connected' : 'no response';
}
function send(cmd) {
  var x = new XMLHttpRequest();
  x.open('GET', robotOrigin() + '/' + cmd + '?' + Date.now(), true);
  x.timeout = 2000;
  x.onload = function () { setLink(true); };   // request landed, response readable
  x.onerror = function () { setLink(false); }; // could be offline, or just no CORS header on this route
  x.ontimeout = function () { setLink(false); };
  x.send();
}

// ---- element lookup by command ----
var ctls = {};
[].forEach.call(document.querySelectorAll('button.ctl'), function (b) {
  ctls[b.dataset.cmd] = b;
});
function setActive(cmd, on) {
  if (ctls[cmd]) ctls[cmd].classList.toggle('active', on);
}

// ---- status indicators ----
function setDrive(cmd) {
  var names = { go: 'forward', back: 'backward', left: 'left', right: 'right' };
  var moving = !!names[cmd];
  document.getElementById('val-drive').textContent = moving ? names[cmd] : 'idle';
  document.getElementById('dot-drive').className = 'dot' + (moving ? ' on' : '');
}
function setLed(on) {
  document.getElementById('val-led').textContent = on ? 'on' : 'off';
  document.getElementById('dot-led').className = 'dot' + (on ? ' on' : '');
}
var shootTimer = null;
function flashShoot() {
  var dot = document.getElementById('dot-shoot');
  var val = document.getElementById('val-shoot');
  dot.className = 'dot fire';
  val.textContent = 'firing';
  clearTimeout(shootTimer);
  shootTimer = setTimeout(function () {
    dot.className = 'dot';
    val.textContent = 'ready';
    setActive('shoot', false);
  }, 350);
}

// ---- command dispatch ----
var current = null; // currently held movement command

function startMove(cmd) {
  if (current === cmd) return;
  if (current) setActive(current, false);
  current = cmd;
  send(cmd);
  setActive(cmd, true);
  setDrive(cmd);
}
function stopMove() {
  if (current) setActive(current, false);
  current = null;
  send('stop');
  setDrive(null);
}
function doCommand(cmd) {
  if (cmd === 'stop') {
    stopMove();
    setActive('stop', true);
    setTimeout(function () { setActive('stop', false); }, 150);
  } else if (cmd === 'ledon') {
    send('ledon'); setLed(true);
    setActive('ledon', true); setActive('ledoff', false);
  } else if (cmd === 'ledoff') {
    send('ledoff'); setLed(false);
    setActive('ledoff', true); setActive('ledon', false);
    setTimeout(function () { setActive('ledoff', false); }, 150);
  } else if (cmd === 'shoot') {
    send('shoot');
    setActive('shoot', true);
    flashShoot();
  }
}

// ---- mouse / touch ----
[].forEach.call(document.querySelectorAll('button.ctl'), function (b) {
  var cmd = b.dataset.cmd;
  if (b.dataset.hold) {
    var down = function (e) { e.preventDefault(); startMove(cmd); };
    var up = function (e) { e.preventDefault(); if (current === cmd) stopMove(); };
    b.addEventListener('mousedown', down);
    b.addEventListener('touchstart', down, { passive: false });
    b.addEventListener('mouseup', up);
    b.addEventListener('mouseleave', up);
    b.addEventListener('touchend', up);
  } else {
    b.addEventListener('click', function () { doCommand(cmd); });
  }
});

// ---- keyboard (uses e.code: physical key, layout independent) ----
var holdKeys = { KeyW: 'go', KeyS: 'back', KeyA: 'left', KeyD: 'right' };
var tapKeys = { ShiftLeft: 'stop', KeyQ: 'ledon', KeyE: 'ledoff', Space: 'shoot' };

window.addEventListener('keydown', function (e) {
  var hold = holdKeys[e.code];
  var tap = tapKeys[e.code];
  if (!hold && !tap) return;
  e.preventDefault();          // stops Space from scrolling the page
  if (e.repeat) return;        // one request per physical press
  if (hold) startMove(hold);
  else { doCommand(tap); setActive(tap, true); }
});

window.addEventListener('keyup', function (e) {
  var hold = holdKeys[e.code];
  if (hold) {
    e.preventDefault();
    if (current === hold) stopMove();
    return;
  }
  if (tapKeys[e.code] && e.code !== 'ShiftLeft') {
    setActive(tapKeys[e.code], false);
  }
});

// safety: never leave the robot driving if the window loses focus
window.addEventListener('blur', function () { if (current) stopMove(); });
</script>
</body>
</html>
